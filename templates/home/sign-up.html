<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ChefFlow | Create Account</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #ffb100;
        --bg-dark: #0f172a;
        --glass: rgba(255, 255, 255, 0.03);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-light: #f8fafc;
        --text-muted: #94a3b8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        background-color: var(--bg-dark);
        background: radial-gradient(circle at bottom left, #1e293b, #0f172a);
        color: var(--text-light);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .back-home {
        position: fixed;
        top: 30px;
        left: 30px;
        color: var(--text-muted);
        text-decoration: none;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.3s;
      }

      .back-home:hover {
        color: var(--primary);
      }

      .auth-card {
        background: var(--glass);
        backdrop-filter: blur(20px);
        padding: 45px;
        border-radius: 28px;
        border: 1px solid var(--glass-border);
        width: 100%;
        max-width: 480px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }

      .auth-header {
        text-align: center;
        margin-bottom: 35px;
      }

      .auth-header h2 {
        font-size: 2.2rem;
        font-weight: 700;
        margin-bottom: 10px;
        letter-spacing: -1px;
        background: linear-gradient(to right, #fff, #94a3b8);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .auth-header p {
        color: var(--text-muted);
      }

      .form-row {
        display: flex;
        gap: 15px;
        margin-bottom: 20px;
      }

      .form-group {
        flex: 1;
        margin-bottom: 20px;
      }

      .full-width {
        width: 100%;
        margin-bottom: 20px;
      }

      label {
        display: block;
        font-size: 0.75rem;
        font-weight: 700;
        margin-bottom: 8px;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      input {
        width: 100%;
        padding: 14px 16px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid var(--glass-border);
        border-radius: 12px;
        color: white;
        font-size: 1rem;
        transition: 0.3s;
      }

      input:focus {
        outline: none;
        border-color: var(--primary);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 0 15px rgba(255, 177, 0, 0.1);
      }

      .btn-submit {
        width: 100%;
        padding: 16px;
        background: var(--primary);
        border: none;
        border-radius: 12px;
        color: #000;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
        margin-top: 10px;
        transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .btn-submit:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(255, 177, 0, 0.3);
      }

      .switch-mode {
        text-align: center;
        margin-top: 25px;
        font-size: 0.9rem;
        color: var(--text-muted);
      }

      .switch-mode a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      @media (max-width: 480px) {
        .form-row {
          flex-direction: column;
          gap: 0;
        }
      }

      /* Custom Aesthetic Message Styling */
      .messages-container {
        margin-top: 20px;
        width: 100%;
      }

      .alert-box {
        padding: 12px 16px;
        border-radius: 10px;
        margin-bottom: 10px;
        font-size: 0.85rem;
        font-weight: 600;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      /* Django Message Tags Mapping */
      .alert-box.success {
        background: rgba(34, 197, 94, 0.1);
        color: #4ade80;
        border-color: rgba(34, 197, 94, 0.2);
      }

      .alert-box.error,
      .alert-box.danger {
        background: rgba(239, 68, 68, 0.1);
        color: #f87171;
        border-color: rgba(239, 68, 68, 0.2);
      }

      .alert-box.warning {
        background: rgba(255, 177, 0, 0.1);
        color: var(--primary);
        border-color: rgba(255, 177, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <a href="index.html" class="back-home">← Back to Home</a>

    <div class="auth-card">
      <div class="auth-header">
        <h2>Get Started</h2>
        <p>Join the ChefFlow family today.</p>
      </div>

      <form action="/signup/" method="post">
        {% csrf_token %}
        <div class="form-row">
          <div class="form-group">
            <label>User Name</label>
            <input
              type="text"
              name="username"
              placeholder="Enter your User Name"
              required
            />
          </div>
        </div>

        <div class="full-width">
          <label>Email Address</label>
          <input
            type="email"
            name="email"
            placeholder="Enter your Email Address"
            required
          />
        </div>

        <div class="full-width">
          <label>Password</label>
          <input type="password" name="password" placeholder="••••••••" required/>
        </div>

        <div class="full-width">
          <label>Confirm Password</label>
          <input type="password" name="cPassword" placeholder="••••••••" required/>
        </div>

        <button type="submit" class="btn-submit">Create Account</button>
      </form>

      {% if messages %}
      <div class="messages-container">
        {% for message in messages %}
        <div class="alert-box {{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}
      <div class="switch-mode">
        Already have an account? <a href="/login/">Log In</a>
      </div>
    </div>
  </body>
</html>
