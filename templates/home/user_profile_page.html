<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Profile - ChefFlow</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary: #ffb100;
        --bg-dark: #0f172a;
        --glass: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-light: #f8fafc;
        --text-muted: #94a3b8;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }

      body {
        background-color: var(--bg-dark);
        color: var(--text-light);
        line-height: 1.6;
        overflow-x: hidden;
      }

      nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.5rem 8%;
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(10px);
        position: fixed;
        width: 100%;
        top: 0;
        z-index: 1000;
        border-bottom: 1px solid var(--glass-border);
      }

      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--primary);
        letter-spacing: -1px;
      }

      .nav-links {
        display: flex;
        gap: 20px;
      }

      .btn {
        padding: 10px 22px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
        transition: 0.3s ease;
        display: inline-block;
      }

      .btn-outline {
        color: var(--text-light);
        border: 1px solid var(--glass-border);
        background: transparent;
      }

      .btn-outline:hover {
        background: var(--glass);
      }

      .btn-filled {
        background: var(--primary);
        color: #000;
      }

      .btn-filled:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(255, 177, 0, 0.3);
      }

      .main-content {
        margin-top: 100px;
        padding: 40px 8%;
        min-height: calc(100vh - 200px);
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
      }

      .profile-header {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 40px;
        margin-bottom: 30px;
        display: flex;
        align-items: center;
        gap: 30px;
      }

      .profile-avatar {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), #ff8c00);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        font-weight: 700;
        color: #000;
        flex-shrink: 0;
      }

      .profile-info {
        flex: 1;
      }

      .profile-info h1 {
        font-size: 2rem;
        margin-bottom: 8px;
        color: var(--text-light);
      }

      .profile-info .email {
        color: var(--text-muted);
        font-size: 1rem;
      }

      .info-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .info-card {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        border-radius: 16px;
        padding: 25px;
        transition: all 0.3s ease;
      }

      .info-card:hover {
        border-color: var(--primary);
        transform: translateY(-3px);
      }

      .info-card-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }

      .info-icon {
        width: 40px;
        height: 40px;
        background: rgba(255, 177, 0, 0.1);
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      .info-card h3 {
        font-size: 0.85rem;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .info-card .info-value {
        font-size: 1.2rem;
        color: var(--text-light);
        font-weight: 600;
        word-break: break-word;
        margin: 1px;
      }

      .profile-actions {
        display: flex;
        gap: 15px;
        justify-content: center;
        flex-wrap: wrap;
      }

      footer {
        text-align: center;
        padding: 40px;
        font-size: 0.8rem;
        color: #64748b;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
      }

      @media (max-width: 768px) {
        .profile-header {
          flex-direction: column;
          text-align: center;
          padding: 30px 20px;
        }

        .profile-info h1 {
          font-size: 1.5rem;
        }

        .info-grid {
          grid-template-columns: 1fr;
        }

        nav {
          flex-direction: column;
          gap: 15px;
          padding: 1rem 5%;
        }

        .main-content {
          padding: 40px 5%;
        }

        .profile-actions {
          flex-direction: column;
        }

        .btn {
          width: 100%;
          text-align: center;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">ChefFlow</div>
      <div class="nav-links">
        <a href="/" class="btn btn-outline">Home</a>
        <a href="/billing/prods/" class="btn btn-outline">Order</a>
        <a href="/logout/" class="btn btn-filled">Logout</a>
      </div>
    </nav>

    <div class="main-content">
      <!-- Profile Header -->
      <div class="profile-header">
        <div class="profile-avatar">{{users.username | slice:":2" | upper}}</div>
        <div class="profile-info">
          <h1>{{users.username}}</h1>
          <p class="email">{{users.email}}</p>
        </div>
      </div>

      <!-- Account Information -->
      <div class="info-grid">
        <div class="info-card">
          <div class="info-card-header">
            <div class="info-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB100" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <h3>Username</h3>
          </div>
          <div class="info-value">{{users.username}}</div>
        </div>

        <div class="info-card">
          <div class="info-card-header">
            <div class="info-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFB100" stroke-width="2">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </div>
            <h3>Email Address</h3>
          </div>
          <div class="info-value">{{users.email}}</div>
        </div>

      <!-- Action Buttons -->
      <div class="profile-actions">
        <a href="/" class="btn btn-outline">Back to Home</a>
        <a href="/billing/prods/" class="btn btn-filled">Place Order</a>
      </div>
    </div>

    <footer>&copy; 2023 ChefFlow Systems. All rights reserved.</footer>
  </body>
</html>
