<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report Configurations | ChefFlow</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --primary: #ffb100;
        --bg-dark: #0f172a;
        --glass: rgba(255, 255, 255, 0.05);
        --glass-border: rgba(255, 255, 255, 0.1);
        --text-light: #f8fafc;
        --text-muted: #94a3b8;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Inter", sans-serif; }
      body { background-color: var(--bg-dark); color: var(--text-light); line-height: 1.6; padding-top: 100px; }

      nav {
        display: flex; justify-content: space-between; align-items: center;
        padding: 1.5rem 8%; background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(10px); position: fixed; width: 100%; top: 0;
        z-index: 1000; border-bottom: 1px solid var(--glass-border);
      }
      .logo { font-size: 1.5rem; font-weight: 700; color: var(--primary); }

      .container { padding: 40px 8%; max-width: 1100px; margin: 0 auto; }

      .header-section { margin-bottom: 40px; }
      .header-section h1 { font-size: 2.2rem; margin-bottom: 10px; }

      /* Setup Grid Layout */
      .layout-grid {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 30px;
      }

      /* Form Sidebar */
      .config-form {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        padding: 30px;
        border-radius: 20px;
        height: fit-content;
        position: sticky;
        top: 120px;
      }

      .form-group { margin-bottom: 20px; }
      .form-group label { display: block; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; }
      .form-group input, .form-group textarea {
        width: 100%; background: rgba(0, 0, 0, 0.2); border: 1px solid var(--glass-border);
        padding: 12px; border-radius: 10px; color: white; outline: none; transition: 0.3s;
      }
      .form-group textarea { height: 100px; resize: none; }
      .form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }

      /* Report Type Cards */
      .type-list { display: flex; flex-direction: column; gap: 20px; }
      .type-card {
        background: var(--glass);
        border: 1px solid var(--glass-border);
        padding: 25px;
        border-radius: 18px;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        transition: 0.3s;
      }
      .type-card:hover { border-color: var(--primary); background: rgba(255, 255, 255, 0.08); }

      .type-info h3 { color: var(--primary); margin-bottom: 5px; font-size: 1.2rem; }
      .type-info p { color: var(--text-muted); font-size: 0.9rem; max-width: 400px; }
      
      .type-id {
        background: rgba(255, 177, 0, 0.1);
        color: var(--primary);
        padding: 5px 12px;
        border-radius: 8px;
        font-family: monospace;
        font-size: 0.8rem;
        font-weight: 700;
        border: 1px solid rgba(255, 177, 0, 0.2);
      }

      .btn-filled {
        background: var(--primary); color: #000; padding: 12px 20px;
        border-radius: 10px; text-decoration: none; font-weight: 700;
        border: none; cursor: pointer; width: 100%; transition: 0.3s;
      }
      .btn-filled:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(255, 177, 0, 0.3); }

      @media (max-width: 850px) {
        .layout-grid { grid-template-columns: 1fr; }
        .config-form { position: static; }
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="logo">ChefFlow</div>
      <div style="display: flex; gap: 15px;">
        <a href="#" class="btn-filled" style="background: transparent; color: white; border: 1px solid var(--glass-border); width: auto;">Reports Feed</a>
      </div>
    </nav>

    <main class="container">
      <header class="header-section">
        <h1>Report Definitions</h1>
        <p style="color: var(--text-muted)">Define the structure and purpose of reports available in the system.</p>
      </header>

      <div class="layout-grid">
        <aside>
          <form class="config-form" method="POST" action="{% url 'Report' %}"> 
            {% csrf_token %}
            <h2 style="margin-bottom: 20px; font-size: 1.2rem;">New Report Type</h2>
            
            <div class="form-group">
              <label>Name</label>
              <input type="text" name="name" placeholder="e.g. Loyalty Points Statement" required>
            </div>
            
            <div class="form-group">
              <label>Description</label>
              <textarea name="description" placeholder="Briefly describe what this report covers..." required></textarea>
            </div>
            
            <button type="submit" class="btn-filled">Save Definition</button>
          </form>
        </aside>

        <section class="type-list">
          {% for param in params %}
          <div class="type-card">
            <div class="type-info">
              <span class="type-id">{{param.reportType}}</span>
              <h3 style="margin-top: 10px;">{{param.name}}</h3>
              <p>{{param.description}}</p>
            </div>
          </div>
          {% endfor %}
        </section>
      </div>
    </main>
  </body>
</html>
